<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <title>방명록 · 김영택</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="guestbook.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문으로</a>
  <header>
    <div class="bar">
      <a href="index.html" class="brand"><b aria-hidden="true">Y.</b> 김영택</a>
      <nav aria-label="주 메뉴">
        <a href="index.html">홈</a>
        <a href="about.html">소개</a>
        <a href="projects.html">프로젝트</a>
        <a href="contact.html">연락처</a>
        <a href="guestbook.html" aria-current="page">방명록</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="page" aria-labelledby="page-title">
      <h1 id="page-title">방명록</h1>
      <div class="book-grid">
        <section class="entries">
          <h2>남겨진 글</h2>
          <div id="entries" aria-live="polite"></div>
          <p id="list-status" role="status">글을 불러오는 중입니다.</p>
          <button id="retry" hidden>다시 시도</button><button id="more" hidden>더 보기</button>
        </section>
        <section class="write-panel">
          <h2>글 남기기</h2>
          <p id="login-hint">로그인하면 메시지를 남길 수 있습니다.</p>
          <button id="login" class="button" disabled>로그인 / 회원가입</button>
          <button id="logout" class="text-link" hidden>로그아웃</button>
          <form id="form" hidden>
            <label for="nickname">닉네임 <small>2~20자</small></label>
            <input id="nickname" required autocomplete="nickname">
            <label for="message">메시지 <small>1~300자</small></label>
            <textarea id="message" rows="5" required></textarea>
            <button class="button" type="submit">등록</button>
          </form>
          <p id="form-status" role="status"></p>
        </section>
      </div>
    </section>
  </main>
  <footer><div>김영택 <span>·</span> 포트폴리오</div><a href="mailto:dudxor789456@naver.com">이메일</a></footer>
</body>
</html>
